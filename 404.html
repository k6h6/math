<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#23261e">
    <title>الصفحة غير موجودة | مغامرات الرياضيات</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body { justify-content: center; display: flex; align-items: center; padding: 16px; }
        .nf-card { max-width: 480px; width: 100%; text-align: center; }
        .nf-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    </style>
</head>
<body>
    <main class="ma-card nf-card">
        <div class="ma-card__icon" style="margin-inline:auto" aria-hidden="true">
            <i class="fa-solid fa-compass"></i>
        </div>
        <h1 style="font-size:1.5rem">404 — الصفحة غير موجودة</h1>
        <p class="text-muted" style="font-size:.9rem">
            عذراً، الرابط الذي طلبته غير صحيح أو تغيّر. يمكنك العودة إلى الصفحة الرئيسية
            للوصول إلى جميع الأدوات: جدول الضرب، القيمة المنزلية، تحدي اليوم، وأوراق العمل.
        </p>
        <div class="nf-actions">
            <a id="homeLink" href="./index.html" class="ma-btn">
                <i class="fa-solid fa-house" aria-hidden="true"></i> الصفحة الرئيسية
            </a>
            <a href="./daily-challenge.html" class="ma-btn ma-btn--secondary">
                <i class="fa-solid fa-calendar-day" aria-hidden="true"></i> تحدي اليوم
            </a>
        </div>
    </main>

    <script>
        (function () {
            try {
                var parts = window.location.pathname.split('/').filter(Boolean);
                if (parts.length > 0) {
                    var root = '/' + parts[0] + '/';
                    document.getElementById('homeLink').setAttribute('href', root + 'index.html');
                }
            } catch (e) { /* keep the relative fallback */ }
        })();
    </script>
</body>
</html>
